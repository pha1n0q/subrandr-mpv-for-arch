name: Build mpv-git + subrandr-git for Arch

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Update system and install base dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm git sudo rust

      - name: Create non-root builder account
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          # Give builder ownership of the workspace so makepkg can write there
          chown -R builder:builder $GITHUB_WORKSPACE

      - name: Build subrandr-git
        run: |
          su - builder -c "
            cd $GITHUB_WORKSPACE/subrandr-git
            makepkg -si --noconfirm
          "

      - name: Build mpv-git
        run: |
          su - builder -c "
            cd $GITHUB_WORKSPACE/mpv-git
            makepkg -s --noconfirm
          "

      - name: Stage packages for upload
        run: |
          mkdir -p staging/
          find $GITHUB_WORKSPACE -name "*.pkg.tar.zst" -exec cp {} staging/ \;

      - name: Upload compiled packages
        uses: actions/upload-artifact@v4
        with:
          name: arch-packages
          path: staging/*.pkg.tar.zst
