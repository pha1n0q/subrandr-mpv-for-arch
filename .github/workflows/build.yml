name: Build mpv-subrandr-git + subrandr-c-git for Arch

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: write
  
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel

    steps:
      - name: Update system and install base dependencies
        run: |
          pacman -Syu --noconfirm git sudo rust github-cli

      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Create non-root builder account
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          # Give builder ownership of the workspace so makepkg can write there
          chown -R builder:builder $GITHUB_WORKSPACE

      - name: Build subrandr-c-git
        run: |
          su - builder -c "
            cd $GITHUB_WORKSPACE/subrandr-git
            makepkg -si --noconfirm
          "

      - name: Build mpv-subrandr-git
        run: |
          su - builder -c "
            cd $GITHUB_WORKSPACE/mpv-git
            makepkg -s --noconfirm
          "

      - name: Stage packages for upload
        run: |
          mkdir -p staging/
          find $GITHUB_WORKSPACE -not -path "*/staging/*" -name "*.pkg.tar.zst" -exec cp {} staging/ \;

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: arch-packages
          path: staging/*.pkg.tar.zst

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="build-$(date -u +'%Y-%m-%d-%H%M%S')"
          RELEASE_DATE=$(date -u +'%Y-%m-%d %H:%M:%S UTC')

          gh release create "$RELEASE_TAG" staging/*.pkg.tar.zst \
            --target ${{ github.sha }} \
            --title "$RELEASE_DATE" \
            --notes "Automated mpv-subrandr-git + subrandr-c-git build compiled on $RELEASE_DATE."
